<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign Up - Stackly</title>
<link href="css/style.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
</head>
<body>
<!-- SIGNUP FORM -->
<section class="auth-section">
<div class="container">
<div class="auth-wrapper animate-on-scroll animated">
<div class="auth-card">
<div class="auth-header">
<img alt="Stackly" class="auth-logo" src="images/stackly logo.webp"/>
<h1>Create Your Account</h1>
<p>Join Stackly and start your journey today</p>
</div>
<form id="signupForm">
<div class="form-group">
<label for="signupName">Full Name *</label>
<input id="signupName" placeholder="John Smith" type="text"/>
</div>
<div class="form-group">
<label for="signupEmail">Email Address *</label>
<input id="signupEmail" placeholder="your@email.com" type="email"/>
</div>
<div class="form-group">
<label for="signupPlan">Choose A Plan</label>
<select id="signupPlan">
<option>Starter - $29/month</option>
<option>Plus - $59/month</option>
<option>Advanced - $99/month</option>
</select>
</div>
<div class="form-group">
<label for="signupPassword">Password *</label>
<div class="password-wrapper">
<input id="signupPassword" placeholder="Create a password" type="password"/>
<button aria-label="Show or hide password" class="password-toggle" data-target="signupPassword" type="button"><i class="fas fa-eye"></i></button>
</div>
</div>
<div class="form-group">
<label for="signupConfirm">Confirm Password *</label>
<div class="password-wrapper">
<input id="signupConfirm" placeholder="Repeat your password" type="password"/>
<button aria-label="Show or hide password" class="password-toggle" data-target="signupConfirm" type="button"><i class="fas fa-eye"></i></button>
</div>
</div>
<div class="form-group">
<label for="signupRole">Select a Role *</label>
<select id="signupRole">
<option disabled="" selected="" value="">Choose a Role</option>
<option value="user">User</option>
<option value="admin">Admin</option>
</select>
</div>
<div class="form-group">
<div class="terms-check">
<input id="signupTerms" type="checkbox"/>
<label for="signupTerms">I agree to the <a href="404.html">Terms &amp; Conditions</a> and <a href="404.html">Privacy Policy</a> *</label>
</div>
</div>
<button class="btn btn-primary" type="submit">Create Account</button>
</form>
<div class="auth-switch">
                        Already have an account? <a href="login.html">Log in</a>
</div>
<div style="text-align: center; margin-top: 20px;">
<a class="btn btn-outline" href="index.html"><i class="fas fa-home" style="margin-right: 8px;"></i>Back To Home</a>
</div>
</div>
</div>
</div>
</section>
<script src="js/main.js"></script>
</body>
</html>
