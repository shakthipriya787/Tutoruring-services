<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Stackly</title>
<link href="css/style.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
</head>
<body>
<!-- LOGIN FORM -->
<section class="auth-section">
<div class="container">
<div class="auth-wrapper animate-on-scroll animated">
<div class="auth-card">
<div class="auth-header">
<img alt="Stackly" class="auth-logo" src="images/stackly logo.webp"/>
<h1>Welcome Back</h1>
<p>Log in to your Stackly student account</p>
</div>
<form id="loginForm">
<div class="form-group">
<label for="loginEmail">Email Address *</label>
<input id="loginEmail" placeholder="your@email.com" type="email"/>
</div>
<div class="form-group">
<label for="loginPassword">Password *</label>
<div class="password-wrapper">
<input id="loginPassword" placeholder="Enter your password" type="password"/>
<button aria-label="Show or hide password" class="password-toggle" data-target="loginPassword" type="button"><i class="fas fa-eye"></i></button>
</div>
</div>
<div class="form-group">
<label for="signupRole">Select a Role *</label>
<select id="signupRole">
<option disabled="" selected="" value="">Choose a Role</option>
<option value="user">User</option>
<option value="admin">Admin</option>
</select>
</div>
<div class="form-group" style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
<label style="display: flex; align-items: center; gap: 8px; margin: 0; font-size: 13px; font-weight: 400; cursor: pointer;">
<input style="width: auto;" type="checkbox"/> Remember me
                            </label>
<a href="404.html" style="color: var(--primary); font-size: 13px; font-weight: 600;">Forgot password?</a>
</div>
<button class="btn btn-primary" type="submit">Log In</button>
</form>
<div class="auth-switch">
                        Don't have an account? <a href="signup.html">Signup</a>
</div>
<div style="text-align: center; margin-top: 20px;">
<a class="btn btn-outline" href="index.html"><i class="fas fa-home" style="margin-right: 8px;"></i>Back To Home</a>
</div>
</div>
</div>
</div>
</section>
<script src="js/main.js"></script>
</body>
</html>
